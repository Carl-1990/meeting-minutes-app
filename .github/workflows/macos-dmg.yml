name: macOS DMG

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

concurrency:
  group: meeting-minutes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for offscreen Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libx11-xcb1 libxcb-xfixes0 libnss3 libsm6 libice6 libxrender1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q

  dmg:
    name: Build arm64 DMG
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm Apple Silicon
        run: |
          uname -m
          test "$(uname -m)" = "arm64"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          QT_QPA_PLATFORM=offscreen python -m pytest -q
      - name: Build DMG
        run: bash build/make_dmg.sh
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-minutes-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
